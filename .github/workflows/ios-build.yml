# Builds an unsigned Release .ipa for sideloading with SideStore (free Apple ID).
# Manual or tag-triggered only: macOS runner minutes are limited on private repos.
name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci

      # Generates ios/ and runs pod install.
      - run: npx expo prebuild --platform ios --clean

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/CallNChat.xcworkspace \
            -scheme CallNChat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CallNChat.app Payload/
          zip -qry CallNChat-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: CallNChat-unsigned-ipa
          path: CallNChat-unsigned.ipa
          retention-days: 14
